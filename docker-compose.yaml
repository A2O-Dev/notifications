services:
  zoo_1:
    container_name: zookeeper_1
    image: zookeeper:3.7.2
    restart: always
    volumes:
      - ./docker/zookeeper/zoo.cfg:/conf/zoo.cfg
      - v_zoo_1:/data
    ports:
      - 2181:2181
    environment:
      ZOO_MY_ID: 1

  zoo_2:
    container_name: zookeeper_2
    image: zookeeper:3.7.2
    restart: always
    volumes:
      - ./docker/zookeeper/zoo.cfg:/conf/zoo.cfg
      - v_zoo_2:/data
    ports:
      - 2182:2181
    environment:
      ZOO_MY_ID: 2

  zoo_3:
    container_name: zookeeper_3
    image: zookeeper:3.7.2
    restart: always
    volumes:
      - ./docker/zookeeper/zoo.cfg:/conf/zoo.cfg
      - v_zoo_3:/data
    ports:
      - 2183:2181
    environment:
      ZOO_MY_ID: 3

  kafka_1:
    container_name: kafka_1
    image: confluentinc/cp-kafka:7.6.1
    restart: always
    ports:
      - 9093:9093
    volumes:
      - kafka_data_1:/bitnami/kafka
    environment:
      - KAFKA_BROKER_ID=1
      - KAFKA_ZOOKEEPER_CONNECT=zoo_1:2181,zoo_2:2181,zoo_3:2181
      - KAFKA_LISTENER_SECURITY_PROTOCOL_MAP=CLIENT:PLAINTEXT,EXTERNAL:PLAINTEXT
      - KAFKA_LISTENERS=CLIENT://:9092,EXTERNAL://:9093
      - KAFKA_ADVERTISED_LISTENERS=CLIENT://kafka_1:9092,EXTERNAL://localhost:9093
      - KAFKA_INTER_BROKER_LISTENER_NAME=CLIENT
      - KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR=1
    depends_on:
      - zoo_1
      - zoo_2
      - zoo_3
    healthcheck:
      test:
        ['CMD', 'kafka-topics', '--bootstrap-server', 'kafka_1:9092', '--list']
      interval: 30s
      timeout: 20s
      retries: 10
      start_period: 60s

  kafka_2:
    container_name: kafka_2
    image: confluentinc/cp-kafka:7.6.1
    restart: always
    ports:
      - 9094:9094
    volumes:
      - kafka_data_2:/bitnami/kafka
    environment:
      - KAFKA_BROKER_ID=2
      - KAFKA_ZOOKEEPER_CONNECT=zoo_1:2181,zoo_2:2181,zoo_3:2181
      - KAFKA_LISTENER_SECURITY_PROTOCOL_MAP=CLIENT:PLAINTEXT,EXTERNAL:PLAINTEXT
      - KAFKA_LISTENERS=CLIENT://:9092,EXTERNAL://:9094
      - KAFKA_ADVERTISED_LISTENERS=CLIENT://kafka_2:9092,EXTERNAL://localhost:9094
      - KAFKA_INTER_BROKER_LISTENER_NAME=CLIENT
      - KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR=1
    depends_on:
      - zoo_1
      - zoo_2
      - zoo_3
    healthcheck:
      test:
        ['CMD', 'kafka-topics', '--bootstrap-server', 'kafka_2:9092', '--list']
      interval: 30s
      timeout: 20s
      retries: 10
      start_period: 60s

  kafka-ui:
    container_name: kafka_ui
    image: provectuslabs/kafka-ui:v0.7.2
    ports:
      - 8080:8080
    environment:
      - KAFKA_CLUSTERS_0_NAME=test
      - KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS=kafka_1:9092,kafka_2:9092
      - KAFKA_CLUSTERS_0_ZOOKEEPER=zoo_1:2181,zoo_2:2181,zoo_3:2181
    depends_on:
      - kafka_1
      - kafka_2

  database:
    container_name: notifications-db
    image: postgres:${POSTGRES_VERSION:-16.3-alpine}
    restart: always
    ports:
      - '5433:5432'
    environment:
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      POSTGRES_DB: ${DB_NAME:-notifications}
    volumes:
      - integrations-db:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'pg_isready -U postgres -d ${DB_NAME:-notifications}',
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: '30s'
      
  mailpit:
    container_name: mailpit
    image: axllent/mailpit:v1.27.7
    restart: always
    ports:
      - "8025:8025" 
      - "1025:1025"
    environment:
      - TZ=America/La_Paz
      - MP_DATABASE=/data/mailpit.db
    volumes:
      - mailpit_data:/data

  integrations-app:
    container_name: notifications-app
    build:
      context: .
      dockerfile: Dockerfile
    restart: always
    ports:
      - '${PORT:-3000}:${PORT:-3000}'
    environment:
      # App
      - APP_ENV=${APP_ENV}
      - TZ=${TZ}
      - PORT=${PORT:-3000}

      # Database
      - DB_HOST=${DB_HOST}
      - DB_PORT=${DB_PORT}
      - DB_NAME=${DB_NAME}
      - DB_USERNAME=${DB_USERNAME}
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_SCHEMA=${DB_SCHEMA}

      # Kafka
      - KAFKA_ENABLED=${KAFKA_ENABLED}
      - KAFKA_GROUP_ID=${KAFKA_GROUP_ID}
      - KAFKA_CONSUMER_CONNECTION_TIMEOUT=${KAFKA_CONSUMER_CONNECTION_TIMEOUT}
      - KAFKA_CONSUMER_RETRIES=${KAFKA_CONSUMER_RETRIES}
      - KAFKA_CONSUMER_RETRY_FACTOR=${KAFKA_CONSUMER_RETRY_FACTOR}
      - KAFKA_CONSUMER_INITIAL_RETRY_TIME=${KAFKA_CONSUMER_INITIAL_RETRY_TIME}
      - KAFKA_CONSUMER_SESSION_TIMEOUT=${KAFKA_CONSUMER_SESSION_TIMEOUT}
      - KAFKA_CONSUMER_HEARTBEAT_INTERVAL=${KAFKA_CONSUMER_HEARTBEAT_INTERVAL}
      - KAFKA_BROKERS=${KAFKA_BROKERS}

      # Mail Service
      - MAIL_HOST=${MAIL_HOST}
      - MAIL_PORT=${MAIL_PORT}
      - MAIL_USERNAME=${MAIL_USERNAME}
      - MAIL_PASSWORD=${MAIL_PASSWORD}
      - MAIL_SECURE=${MAIL_SECURE}
      - MAIL_FROM_ADDRESS=${MAIL_FROM_ADDRESS}
      - MAIL_FROM_NAME=${MAIL_FROM_NAME}

      # Whatsapp API
      - WHATSAPP_API_URL=${WHATSAPP_API_URL}
      - WHATSAPP_PHONE_NUMBER_ID=${WHATSAPP_PHONE_NUMBER_ID}
      - WHATSAPP_ACCESS_TOKEN=${WHATSAPP_ACCESS_TOKEN}
      - WHATSAPP_PRODUCT_NAME=${WHATSAPP_PRODUCT_NAME}

      # Cron Jobs
      - ENABLED_CRON_JOB_EXECUTE_QUEUE_MESSAGES=${ENABLED_CRON_JOB_EXECUTE_QUEUE_MESSAGES}
      - CRON_JOB_EXECUTE_QUEUE_MESSAGES=${CRON_JOB_EXECUTE_QUEUE_MESSAGES}
      - MAX_RETRIES_QUEUE_MESSAGES=${MAX_RETRIES_QUEUE_MESSAGES}
      - ENABLED_CRON_JOB_EXECUTE_DELETE_NOTIFICATIONS=${ENABLED_CRON_JOB_EXECUTE_DELETE_NOTIFICATIONS}
      - CRON_JOB_EXECUTE_DELETE_NOTIFICATIONS=${CRON_JOB_EXECUTE_DELETE_NOTIFICATIONS}
      - DAYS_NUMBER_TO_DELETE_NOTIFICATIONS=${DAYS_NUMBER_TO_DELETE_NOTIFICATIONS}
    depends_on:
      - database
      - kafka_1
      - kafka_2
    volumes:
      - ./logs:/usr/src/app/logs

  kafka-topics-init:
    container_name: kafka-topics-init
    image: confluentinc/cp-kafka:7.6.1
    depends_on:
      kafka_1:
        condition: service_healthy
      kafka_2:
        condition: service_healthy
    command: |
      bash -c "
        echo 'Esperando a que Kafka esté completamente listo...' &&
        sleep 20 &&
        echo 'Creando topics de Notifications...' &&
        kafka-topics --bootstrap-server kafka_1:9092 --create --if-not-exists --topic send_message --partitions 3 --replication-factor 1 &&
        echo '=== Topics creados ===' &&
        kafka-topics --bootstrap-server kafka_1:9092 --list
      "
    profiles: ['setup']

volumes:
  v_zoo_1:
  v_zoo_2:
  v_zoo_3:
  notifications-db:
  mailpit_data:
